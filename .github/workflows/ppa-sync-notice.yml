name: PPA sync notice

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ppa-sync-notice
  cancel-in-progress: false

env:
  DISTS: jammy

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      - name: Check for PPA updates
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          msg=""
          for dist in $DISTS; do
            state="last_seen_$dist.json"
            pkgs=$(mktemp)
            lm=$(curl -fsSL -o "$pkgs" -w '%header{last-modified}' \
              "https://ppa.setup-php.com/ondrej/php/ubuntu/dists/$dist/main/binary-amd64/Packages")
            updated=$(jq -rn --arg lm "$lm" '$lm | strptime("%a, %d %b %Y %H:%M:%S GMT") | todate')
            new=$(awk '/^Package:/{p=$2} /^Version:/{print p, $2}' "$pkgs" | sort)
            status="no update"
            if [ -f "$state" ]; then
              old=$(jq -r '.packages[]' "$state")
              changed=$(comm -13 <(echo "$old") <(echo "$new"))
              if [ -n "$changed" ]; then
                status="updated"
                count=$(grep -c . <<< "$changed")
                msg+="**$dist**: $count packages updated"$'\n```\n'"$(head -10 <<< "$changed")"$'\n```\n'
                [ "$count" -gt 10 ] && msg+="…and $((count - 10)) more"$'\n'
              fi
            fi
            jq -R -n --arg status "$status" --arg updated "$updated" \
              '{status: $status, updated: $updated, packages: [inputs]}' \
              <<< "$new" > "$state"
          done
          if [ -n "$msg" ]; then
            msg="setup-php PPA mirror updated"$'\n'"$msg"
            jq -n --arg c "${msg:0:2000}" '{content: $c}' \
              | curl -fsS -H 'Content-Type: application/json' -d @- "$DISCORD_WEBHOOK_URL"
          fi

      - name: Commit state files if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_seen_*.json
          if ! git diff --cached --quiet; then
            git commit -m "Update last seen PPA packages"
            git push
          fi
